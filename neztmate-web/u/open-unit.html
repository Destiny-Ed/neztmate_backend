<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeztMate — View unit</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 48px auto; padding: 0 20px; text-align: center; }
    h1 { font-size: 1.4rem; }
    p { color: #555; line-height: 1.5; }
    a.btn {
      display: block; margin: 12px 0; padding: 14px 16px; border-radius: 12px;
      text-decoration: none; font-weight: 600;
    }
    .primary { background: #0d9488; color: #fff; }
    .secondary { background: #f3f4f6; color: #111; }
  </style>
</head>
<body>
  <h1>Open this unit in NeztMate</h1>
  <p>If the app is installed, we’ll open it. Otherwise, download NeztMate to view and apply.</p>

  <a class="btn primary" id="openApp" href="#">Open in app</a>
  <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.nextmate.app">
    Get on Google Play
  </a>
  <a class="btn secondary" href="https://apps.apple.com/app/idYOUR_APPLE_APP_ID">
    Get on the App Store
  </a>

  <script>
    (function () {
      var path = window.location.pathname; // /u/{unitId}
      var parts = path.split('/').filter(Boolean);
      var unitId = parts[0] === 'u' && parts[1] ? parts[1] : null;

      // Custom scheme fallback (always works if app handles it)
      var custom = unitId ? 'neztmate://unit/' + encodeURIComponent(unitId) : 'neztmate://';

      // Same https URL — OS may hand off to app if App Links / Universal Links are verified
      var httpsLink = window.location.href;

      var openBtn = document.getElementById('openApp');
      openBtn.href = custom;

      function tryOpen() {
        // 1) Prefer universal/app link (same page URL)
        // 2) Also try custom scheme
        window.location.href = custom;

        // If still here after ~1.5s, user likely doesn't have the app
        setTimeout(function () {
          // stay on page so they can use store buttons
        }, 1500);
      }

      openBtn.addEventListener('click', function (e) {
        e.preventDefault();
        tryOpen();
      });

      // Auto-attempt once on load
      if (unitId) {
        setTimeout(tryOpen, 300);
      }
    })();
  </script>
</body>
</html>
