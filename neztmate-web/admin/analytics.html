<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics · NeztMate Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Analytics</strong> <span class="muted" id="partner-label"></span></div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
          <button type="button" class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
        </div>
      </header>
      <div class="admin-content">
        <h1 class="page-title" id="page-title">Analysis</h1>
        <p class="page-sub" id="page-sub">Operations and revenue snapshot</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div id="info" class="alert alert-ok" style="display:none"></div>

        <h2 style="font-size:1rem;margin:0 0 .75rem">Operations</h2>
        <div class="kpi-grid" id="kpi-ops"></div>

        <h2 style="font-size:1rem;margin:1.5rem 0 .75rem">Revenue &amp; fees</h2>
        <div class="kpi-grid" id="kpi-money"></div>

        <div class="panel" style="margin-top:1.25rem">
          <div class="panel-head">
            <h3>Breakdown</h3>
          </div>
          <div class="panel-body" id="breakdown">Loading…</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('analytics.html');

    function kpi(label, value, sub) {
      return (
        '<div class="kpi"><label>' +
        AdminGuard.esc(label) +
        '</label><strong>' +
        value +
        '</strong>' +
        (sub ? '<span class="muted" style="font-size:.75rem">' + AdminGuard.esc(sub) + '</span>' : '') +
        '</div>'
      );
    }

    async function load() {
      AdminGuard.clearAlerts();
      const isP = AdminGuard.isPlatform();
      document.getElementById('page-title').textContent = isP ? 'Platform analysis' : 'Partner analysis';

      const ops = document.getElementById('kpi-ops');
      const money = document.getElementById('kpi-money');
      const breakdown = document.getElementById('breakdown');

      if (isP) {
        const [a, partnersRes, rev] = await Promise.all([
          AdminGuard.api(() => NeztMateApi.getPlatformAnalytics(), {}),
          AdminGuard.api(() => NeztMateApi.listPartners(), { partners: [] }),
          AdminGuard.api(() => NeztMateApi.getRevenueMetrics(), {}),
        ]);
        const list = partnersRes.partners || partnersRes || [];
        ops.innerHTML = [
          kpi('Partners', list.length, 'Workspaces'),
          kpi('Active partners', a.activePartners ?? list.filter((p) => p.isActive !== false).length),
          kpi('Users', a.totalUsers ?? '—'),
          kpi('Properties', a.totalProperties ?? '—'),
          kpi('Active leases', a.activeLeases ?? '—'),
          kpi('Active subscriptions', a.activeSubscriptions ?? rev.activeSubscriptions ?? '—'),
        ].join('');

        money.innerHTML = [
          kpi('GMV (all paid)', AdminGuard.money(rev.totalPaidVolume ?? a.totalPaymentsVolume)),
          kpi('Subscription revenue', AdminGuard.money(rev.subscriptionRevenue)),
          kpi('Application fees', AdminGuard.money(rev.applicationFeeRevenue)),
          kpi('Platform fees', AdminGuard.money(rev.platformFeeRevenue)),
          kpi('Pending withdrawals', AdminGuard.money(rev.pendingWithdrawals)),
          kpi('Completed withdrawals', AdminGuard.money(rev.completedWithdrawals)),
        ].join('');

        breakdown.innerHTML =
          '<ul style="margin:0;padding-left:1.1rem;line-height:1.7">' +
          '<li>Pending partner requests: <strong>' +
          (a.pendingPartnerRequests ?? '—') +
          '</strong></li>' +
          '<li>Rent payments (paid): <strong>' +
          AdminGuard.money(rev.rentRevenue) +
          '</strong></li>' +
          '<li>Task / maintenance settlements: <strong>' +
          AdminGuard.money(rev.taskPaymentRevenue) +
          '</strong></li>' +
          '<li>Affiliate commissions paid: <strong>' +
          AdminGuard.money(rev.affiliatePayouts) +
          '</strong></li>' +
          '</ul>';
      } else {
        const [pa, s, rev, fee] = await Promise.all([
          AdminGuard.api(() => NeztMateApi.getPartnerAnalytics(), {}),
          AdminGuard.api(() => NeztMateApi.getPaymentSummary(), {}),
          AdminGuard.api(() => NeztMateApi.getRevenueMetrics(), {}),
          AdminGuard.api(() => NeztMateApi.getApplicationFeeSettings(), {}),
        ]);
        const sum = s.summary || s || {};

        ops.innerHTML = [
          kpi('Properties', pa.totalProperties ?? '—'),
          kpi('Units', pa.totalUnits ?? '—'),
          kpi('Active leases', pa.activeLeases ?? '—'),
          kpi('Pending apps', pa.pendingApplications ?? '—'),
          kpi('Open maintenance', pa.openMaintenance ?? '—'),
          kpi('Plan', pa.subscriptionPlan || rev.subscriptionPlan || 'free'),
        ].join('');

        money.innerHTML = [
          kpi('Received (rent etc.)', AdminGuard.money(sum.totalReceived ?? rev.totalReceived ?? pa.totalReceived)),
          kpi('Withdrawable', AdminGuard.money(sum.withdrawableAmount ?? rev.withdrawableAmount)),
          kpi('Application fees collected', AdminGuard.money(rev.applicationFeeRevenue)),
          kpi('Subscription paid', AdminGuard.money(rev.subscriptionRevenue)),
          kpi(
            'App fee setting',
            fee.enabled || fee.applicationFeeEnabled
              ? AdminGuard.money(fee.amount ?? fee.applicationFeeAmount)
              : 'Off'
          ),
          kpi('Withdrawn', AdminGuard.money(rev.completedWithdrawals ?? sum.totalWithdrawn)),
        ].join('');

        breakdown.innerHTML =
          '<ul style="margin:0;padding-left:1.1rem;line-height:1.7">' +
          '<li>Application fee: <strong>' +
          (fee.enabled || fee.applicationFeeEnabled ? 'Enabled' : 'Disabled') +
          '</strong> · ' +
          AdminGuard.money(fee.amount ?? fee.applicationFeeAmount ?? 0) +
          ' — change under Settings</li>' +
          '<li>Pending withdrawals: <strong>' +
          AdminGuard.money(rev.pendingWithdrawals) +
          '</strong></li>' +
          '</ul>';
      }
    }

    document.getElementById('refresh-btn').onclick = load;
    load();
  </script>
</body>

</html>
