<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Analytics</strong> <span class="muted" id="partner-label"></span></div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
          <button type="button" class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
        </div>
      </header>
      <div class="admin-content">
        <h1 class="page-title" id="page-title">Analysis</h1>
        <p class="page-sub" id="page-sub">Operational snapshot</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div id="info" class="alert alert-ok" style="display:none"></div>
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="panel">
          <div class="panel-head"><h3>Breakdown</h3></div>
          <div class="panel-body" id="breakdown">Loading…</div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('analytics.html');
    async function load() {
      AdminGuard.clearAlerts();
      var isP = AdminGuard.isPlatform();
      document.getElementById('page-title').textContent = isP ? 'Platform analysis' : 'Partner analysis';
      var grid = document.getElementById('kpi-grid');
      if (isP) {
        var a = await AdminGuard.api(function(){ return NeztMateApi.getPlatformAnalytics(); }, {});
        var partners = await AdminGuard.api(function(){ return NeztMateApi.listPartners(); }, { partners: [] });
        var list = partners.partners || partners || [];
        grid.innerHTML = [
          ['Partners', list.length],
          ['Active partners', a.activePartners ?? list.filter(function(p){return p.isActive!==false}).length],
          ['Users', a.totalUsers ?? '—'],
          ['Properties', a.totalProperties ?? '—'],
          ['Active leases', a.activeLeases ?? '—'],
          ['GMV', AdminGuard.money(a.totalPaymentsVolume)]
        ].map(function(x){ return '<div class="kpi"><label>'+x[0]+'</label><strong>'+x[1]+'</strong></div>'; }).join('');
        document.getElementById('breakdown').textContent = 'Pending partner requests: ' + (a.pendingPartnerRequests ?? '—') + '. Active subscriptions: ' + (a.activeSubscriptions ?? '—');
      } else {
        var pa = await AdminGuard.api(function(){ return NeztMateApi.getPartnerAnalytics(); }, {});
        var s = await AdminGuard.api(function(){ return NeztMateApi.getPaymentSummary(); }, {});
        var sum = s.summary || s || {};
        grid.innerHTML = [
          ['Properties', pa.totalProperties ?? '—'],
          ['Units', pa.totalUnits ?? '—'],
          ['Active leases', pa.activeLeases ?? '—'],
          ['Pending apps', pa.pendingApplications ?? '—'],
          ['Received', AdminGuard.money(sum.totalReceived ?? pa.totalReceived)],
          ['Withdrawable', AdminGuard.money(sum.withdrawableAmount ?? pa.withdrawableAmount)]
        ].map(function(x){ return '<div class="kpi"><label>'+x[0]+'</label><strong>'+x[1]+'</strong></div>'; }).join('');
        document.getElementById('breakdown').textContent = 'Open maintenance: ' + (pa.openMaintenance ?? '—') + '. Plan: ' + (pa.subscriptionPlan || 'free');
      }
    }
    document.getElementById('refresh-btn').onclick = load;
    load();
  </script>
</body>
</html>
