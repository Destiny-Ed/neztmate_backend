<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leases · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Leases</strong> <span class="muted" id="partner-label"></span></div>
        <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
      </header>
      <div class="admin-content">
        <h1 class="page-title">Leases</h1>
        <p class="page-sub">Active, pending payment, and historical agreements.</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div class="toolbar">
          <input class="search" id="q" placeholder="Search…" />
          <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        </div>
        <div class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr><th>Lease</th><th>Tenant</th><th>Unit</th><th>Period</th><th>Status</th><th>Rent</th></tr>
              </thead>
              <tbody id="tbody"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('leases.html');
    let all = [];
    async function load() {
      const data = await AdminGuard.api(() => NeztMateApi.listLeases(), { leases: [] });
      all = data.leases || data || [];
      if (!Array.isArray(all)) all = [];
      render();
    }
    function render() {
      const q = document.getElementById('q').value.toLowerCase();
      const list = all.filter((l) => !q || JSON.stringify(l).toLowerCase().includes(q));
      const tb = document.getElementById('tbody');
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="6" class="empty-state">No leases</td></tr>';
        return;
      }
      tb.innerHTML = list
        .map(
          (l) => `<tr>
        <td><code style="font-size:.75rem">${AdminGuard.esc(String(l.id || '').slice(0, 10))}</code></td>
        <td>${AdminGuard.esc(l.tenantId ? String(l.tenantId).slice(0, 8) : '—')}</td>
        <td>${AdminGuard.esc(l.unitId ? String(l.unitId).slice(0, 8) : '—')}</td>
        <td style="font-size:.8rem">${l.startDate ? new Date(l.startDate).toLocaleDateString() : '—'} → ${l.endDate ? new Date(l.endDate).toLocaleDateString() : '—'}</td>
        <td>${AdminGuard.badge(l.status)}</td>
        <td>${AdminGuard.money(l.monthlyRent ?? l.yearlyRent)}</td>
      </tr>`
        )
        .join('');
    }
    document.getElementById('q').oninput = render;
    document.getElementById('refresh').onclick = load;
    load();
  </script>
</body>
</html>
