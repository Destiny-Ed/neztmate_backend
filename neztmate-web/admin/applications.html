<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Applications · NeztMate Admin</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Applications</strong> <span class="muted" id="partner-label"></span></div>
        <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
      </header>
      <div class="admin-content">
        <h1 class="page-title">Lease applications</h1>
        <p class="page-sub">Inbound tenancy applications for your properties.</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div class="toolbar"><button class="btn btn-ghost btn-sm" id="refresh">Refresh</button></div>
        <div class="panel">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tenant</th>
                  <th>Unit</th>
                  <th>Status</th>
                  <th>Applied</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr>
                  <td colspan="5" class="empty-state">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('applications.html');
    async function load() {
      const params = {};
      const st = document.getElementById('status')?.value;
      if (st) params.status = st;
      const data = await AdminGuard.api(
        () => NeztMateApi.listApplicationsAdmin(params),
        { applications: [] }
      );
      all = data.applications || [];
      render();
    }

    function openApp(a) {
      AdminGuard.showDetail({
        title: a.property?.name || 'Application',
        rows: [
          ['ID', a.id],
          ['Status', a.status],
          ['Applied', AdminGuard.fmtDate(a.appliedAt)],
          ['Tenant', a.tenant?.fullName],
          ['Email', a.tenant?.email],
          ['Phone', a.tenant?.phone],
          ['Property', a.property?.name],
          ['Address', a.property?.address],
          ['Unit', a.unit?.unitNumber],
          ['Rent', a.unit?.monthlyRent],
          ['Message', a.message],
          ['Proposed rent', a.proposedRent],
          ['Desired start', AdminGuard.fmtDate(a.desiredStartDate)],
          ['Reviewed by', a.reviewedBy],
          ['Reviewed at', AdminGuard.fmtDate(a.reviewedAt)],
          ['Partner', a.partnerId],
        ],
      });
    }
    document.getElementById('refresh').onclick = load;
    load();
  </script>
</body>

</html>
