<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Dashboard</strong> <span class="muted" id="partner-label"></span></div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button type="button" class="theme-toggle" id="theme-toggle" title="Theme">🌙</button>
          <button type="button" class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
        </div>
      </header>
      <div class="admin-content">
        <h1 class="page-title" id="page-title">Overview</h1>
        <p class="page-sub" id="page-sub">Workspace snapshot</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div id="info" class="alert alert-ok" style="display:none"></div>
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="panel">
          <div class="panel-head"><h3>Quick actions</h3></div>
          <div class="panel-body actions" id="quick-actions"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Recent signals</h3></div>
          <div class="panel-body" id="signals"><div class="empty-state">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw new Error('auth');
    AdminShell.mount('index.html');

    async function load() {
      AdminGuard.clearAlerts();
      const isP = AdminGuard.isPlatform();
      document.getElementById('page-title').textContent = isP ? 'Platform overview' : 'Partner overview';
      document.getElementById('page-sub').textContent = isP
        ? 'Partners, requests, and network health'
        : 'Properties, money, and operations in your workspace';

      const qa = document.getElementById('quick-actions');
      if (isP) {
        qa.innerHTML = `
          <a class="btn btn-primary btn-sm" href="partner-create.html">Create partner</a>
          <a class="btn btn-ghost btn-sm" href="partner-requests.html">Review requests</a>
          <a class="btn btn-ghost btn-sm" href="partners-list.html">All partners</a>
          <a class="btn btn-ghost btn-sm" href="users.html">Users</a>
          <a class="btn btn-ghost btn-sm" href="analytics.html">Analytics</a>`;
      } else {
        qa.innerHTML = `
          <a class="btn btn-primary btn-sm" href="properties.html">Properties</a>
          <a class="btn btn-ghost btn-sm" href="units.html">Units</a>
          <a class="btn btn-ghost btn-sm" href="leases.html">Leases</a>
          <a class="btn btn-ghost btn-sm" href="payments.html">Payments</a>
          <a class="btn btn-ghost btn-sm" href="branding.html">Branding</a>
          <a class="btn btn-ghost btn-sm" href="settings.html">Settings</a>`;
      }

      const grid = document.getElementById('kpi-grid');
      grid.innerHTML = '<div class="kpi"><label>Loading</label><strong>…</strong></div>';

      if (isP) {
        const partners = await AdminGuard.api(() => NeztMateApi.listPartners(), { partners: [] });
        const list = partners.partners || partners || [];
        const active = list.filter((p) => p.isActive !== false).length;
        const reqs = await AdminGuard.api(() => NeztMateApi.listPartnerRequests(), { requests: [] });
        const requests = reqs.requests || reqs || [];
        const pending = requests.filter((r) => String(r.status || '').toLowerCase() === 'pending').length;
        const analytics = await AdminGuard.api(() => NeztMateApi.getPlatformAnalytics(), {});
        grid.innerHTML = [
          kpi('Partners', list.length, active + ' active'),
          kpi('Pending requests', pending, requests.length + ' total'),
          kpi('Users', analytics.totalUsers ?? '—', 'Network'),
          kpi('Properties', analytics.totalProperties ?? '—', 'All workspaces'),
          kpi('Active leases', analytics.activeLeases ?? '—', ''),
          kpi('GMV', AdminGuard.money(analytics.totalPaymentsVolume), 'Paid volume'),
        ].join('');
        document.getElementById('signals').innerHTML =
          pending > 0
            ? '<p><strong>' + pending + '</strong> partner request(s) awaiting review. <a href="partner-requests.html">Open queue →</a></p>'
            : '<p class="muted">No pending partner requests.</p>';
      } else {
        const props = await AdminGuard.api(() => NeztMateApi.getMyProperties(), { properties: [] });
        const properties = props.properties || props || [];
        const summary = await AdminGuard.api(() => NeztMateApi.getPaymentSummary(), {});
        const s = summary.summary || summary || {};
        const analytics = await AdminGuard.api(() => NeztMateApi.getPartnerAnalytics(), {});
        grid.innerHTML = [
          kpi('Properties', Array.isArray(properties) ? properties.length : 0, 'Your portfolio'),
          kpi('Units', analytics.totalUnits ?? '—', ''),
          kpi('Active leases', analytics.activeLeases ?? '—', ''),
          kpi('Pending apps', analytics.pendingApplications ?? '—', ''),
          kpi('Received', AdminGuard.money(s.totalReceived ?? analytics.totalReceived), ''),
          kpi('Withdrawable', AdminGuard.money(s.withdrawableAmount ?? analytics.withdrawableAmount), ''),
        ].join('');
        document.getElementById('signals').innerHTML =
          '<p class="muted">Use the sidebar to manage properties, units, leases, and payments. Branding updates the public site theme for your slug.</p>';
      }
    }

    function kpi(label, value, sub) {
      return '<div class="kpi"><label>' + label + '</label><strong>' + value + '</strong>' +
        (sub ? '<div class="muted" style="font-size:.75rem;margin-top:.2rem">' + sub + '</div>' : '') + '</div>';
    }

    document.getElementById('refresh-btn').onclick = load;
    load();
  </script>
</body>
</html>
