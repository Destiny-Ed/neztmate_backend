<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payments · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Payments</strong> <span class="muted" id="partner-label"></span></div>
        <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
      </header>
      <div class="admin-content">
        <h1 class="page-title">Payments</h1>
        <p class="page-sub">History and summary for this workspace.</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div class="kpi-grid" id="kpi"></div>
        <div class="panel"><div class="table-wrap">
          <table class="table">
            <thead><tr><th>Ref</th><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('payments.html');
    async function load() {
      const summary = await AdminGuard.api(() => NeztMateApi.getPaymentSummary(), {});
      const s = summary.summary || summary || {};
      document.getElementById('kpi').innerHTML = [
        ['Received', AdminGuard.money(s.totalReceived)],
        ['Withdrawn', AdminGuard.money(s.totalWithdrawn)],
        ['Withdrawable', AdminGuard.money(s.withdrawableAmount)],
        ['Pending', s.pendingPayments ?? '—']
      ].map(function(x){ return '<div class="kpi"><label>'+x[0]+'</label><strong>'+x[1]+'</strong></div>'; }).join('');
      const data = await AdminGuard.api(() => NeztMateApi.getMyPayments(), { payments: [] });
      const list = data.payments || data || [];
      const tb = document.getElementById('tbody');
      if (!list.length) { tb.innerHTML = '<tr><td colspan="5" class="empty-state">No payments</td></tr>'; return; }
      tb.innerHTML = list.map(function(p){
        return '<tr><td><code style="font-size:.75rem">'+AdminGuard.esc(p.transactionRef||p.id||'')+'</code></td><td>'+AdminGuard.esc(p.type||'—')+'</td><td>'+AdminGuard.money(p.amount)+'</td><td>'+AdminGuard.badge(p.status)+'</td><td>'+(p.createdAt?new Date(p.createdAt).toLocaleString():'—')+'</td></tr>';
      }).join('');
    }
    load();
  </script>
</body>
</html>
