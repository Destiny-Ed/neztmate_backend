<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payments · NeztMate Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="logo" href="index.html">Nezt<span>Mate</span></a>
        <nav>
          <a href="index.html">Dashboard</a>
        <a href="partner-requests.html">Partner requests</a>
          <a href="properties.html">Properties</a>
          <a class="active" href="payments.html">Payments</a>
          <a href="notifications.html">Notifications</a>
          <a href="#" id="logout-link">Sign out</a>
        </nav>
        <div class="side-foot" id="side-user">Signed in</div>
      </aside>
      <div class="admin-main">
        <header class="admin-top">
          <strong>Payments</strong>
          <a class="btn btn-ghost btn-sm" href="../index.html">View site</a>
        </header>
        <div class="admin-content">
          <h1 class="page-title">Payments</h1>
          <p class="page-sub">History for the signed-in user (partner-scoped).</p>
          <div id="error" class="alert alert-error" style="display: none"></div>
          <div class="panel">
            <div class="panel-head"><h3>All payments</h3></div>
            <div class="table-wrap">
              <table class="data">
                <thead>
                  <tr>
                    <th>Ref</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Created</th>
                  </tr>
                </thead>
                <tbody id="tbody">
                  <tr>
                    <td colspan="5" class="empty-state">Loading…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
      AdminGuard.requireAuth();
      const money = (n) =>
        typeof n === 'number'
          ? '₦' + n.toLocaleString('en-NG', { maximumFractionDigits: 0 })
          : '—';
      (async () => {
        const tbody = document.getElementById('tbody');
        const errEl = document.getElementById('error');
        try {
          const data = await NeztMateApi.getMyPayments();
          const list = data.payments || [];
          if (!list.length) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="empty-state">No payments</td></tr>';
            return;
          }
          tbody.innerHTML = list
            .map((p) => {
              const date = p.createdAt ? new Date(p.createdAt).toLocaleString() : '—';
              return `<tr>
                <td>${p.transactionRef || p.id || '—'}</td>
                <td>${p.type || '—'}</td>
                <td>${money(Number(p.amount))}</td>
                <td><span class="badge-soft">${p.status || '—'}</span></td>
                <td>${date}</td>
              </tr>`;
            })
            .join('');
        } catch (e) {
          errEl.style.display = 'block';
          errEl.textContent = e.message || 'Failed to load payments';
          tbody.innerHTML =
            '<tr><td colspan="5" class="empty-state">Could not load</td></tr>';
        }
      })();
    </script>
  </body>
</html>
