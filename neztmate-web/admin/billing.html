<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billing · NeztMate Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="admin-main">
            <header class="admin-top">
                <div><strong>Billing</strong> <span class="muted" id="partner-label"></span></div>
                <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
            </header>
            <div class="admin-content billing-page">
                <h1 class="page-title">Plans for landowners</h1>
                <p class="page-sub" id="page-sub">Create and manage subscription plans landowners can buy in your
                    workspace.</p>
                <div id="error" class="alert alert-error" style="display:none"></div>
                <div id="info" class="alert alert-ok" style="display:none"></div>

                <!-- Platform toolbar -->
                <div class="toolbar" id="platform-toolbar"
                    style="display:none;flex-wrap:wrap;gap:.75rem;align-items:center">
                    <label class="muted" style="font-size:.85rem">Workspace</label>
                    <select id="partner-select" class="search" style="max-width:260px">
                        <option value="">Select partner…</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm" id="btn-new-plan">New plan</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="btn-partner-limits">Workspace limits</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
                </div>

                <!-- Partner admin toolbar -->
                <div class="toolbar" id="partner-toolbar"
                    style="display:none;flex-wrap:wrap;gap:.75rem;align-items:center">
                    <button type="button" class="btn btn-primary btn-sm" id="btn-new-plan-partner">New plan</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="refresh-partner">Refresh</button>
                </div>

                <!-- Platform: workspace limits panel -->
                <div class="panel" id="partner-limits-panel" style="display:none;margin:1rem 0 1.25rem">
                    <div class="panel-head"
                        style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                        <h3 style="margin:0">Workspace limits</h3>
                        <span class="muted" style="font-size:.85rem" id="limits-workspace-label"></span>
                    </div>
                    <div class="panel-body" style="display:grid;gap:.75rem;max-width:520px">
                        <p class="muted" style="margin:0">Controls access for this partner brand. Separate from
                            landowner plan prices below.</p>
                        <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox"
                                id="pl-app-enabled" checked /> App enabled</label>
                        <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox"
                                id="pl-subs-enabled" checked /> Landowner subscriptions enabled</label>
                        <label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox"
                                id="pl-apps-enabled" checked /> Lease applications enabled</label>
                        <div class="field"><label>Max landowners (−1 = unlimited)</label><input id="pl-max-landowners"
                                type="number" value="-1" /></div>
                        <div class="field"><label>Max properties (−1 = unlimited)</label><input id="pl-max-properties"
                                type="number" value="-1" /></div>
                        <div class="field"><label>Max units (−1 = unlimited)</label><input id="pl-max-units"
                                type="number" value="-1" /></div>
                        <div>
                            <button type="button" class="btn btn-primary btn-sm" id="pl-save">Save limits</button>
                        </div>
                    </div>
                </div>

                <div class="toolbar" style="margin-top:.5rem;align-items:center;gap:.75rem">
                    <span class="muted" style="font-size:.85rem">Price display</span>
                    <select id="cycle" class="search" style="max-width:140px">
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div class="grid-3" id="plans-grid" style="margin-top:1rem">
                    <div class="card empty-state" style="grid-column:1/-1">Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <div id="plan-modal" class="modal-backdrop hidden">
        <div class="modal" style="max-width:480px">
            <div class="modal-head">
                <h3 id="plan-modal-title">New plan</h3>
                <button type="button" class="btn btn-ghost btn-sm" data-close-plan>×</button>
            </div>
            <div class="modal-body">
                <div class="field"><label>Plan</label>
                    <select id="plan-name">
                        <option value="free">Free</option>
                        <option value="basic">Basic</option>
                        <option value="pro">Pro</option>
                        <option value="premium">Premium</option>
                        <option value="business">Business</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                </div>
                <div class="field"><label>Description</label>
                    <textarea id="plan-description" rows="2"
                        placeholder="Shown on pricing / subscribe pages"></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                    <div class="field"><label>Monthly (₦)</label><input id="plan-monthly" type="number" min="0" step="1"
                            value="0" /></div>
                    <div class="field"><label>Yearly (₦)</label><input id="plan-yearly" type="number" min="0" step="1"
                            value="0" /></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                    <div class="field"><label>Max units (−1 ∞)</label><input id="plan-max-units" type="number"
                            value="3" /></div>
                    <div class="field"><label>Max listings (−1 ∞)</label><input id="plan-max" type="number" value="3" />
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                    <div class="field"><label>Max properties (−1 ∞)</label><input id="plan-max-properties" type="number"
                            value="1" /></div>
                    <div class="field"><label>Max managers (0 off)</label><input id="plan-max-managers" type="number"
                            value="0" /></div>
                </div>
                <div class="field"><label>Max artisans (0 off, −1 ∞)</label><input id="plan-max-artisans" type="number"
                        value="0" /></div>
                <label style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0"><input type="checkbox"
                        id="plan-agent" /> Manager / artisan invites</label>
                <label style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0"><input type="checkbox"
                        id="plan-screening" /> Advanced screening</label>
                <label style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0"><input type="checkbox"
                        id="plan-analytics" /> Analytics</label>
                <label style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0"><input type="checkbox"
                        id="plan-support" /> Priority support</label>
                <label style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0"><input type="checkbox"
                        id="plan-active" checked /> Active</label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost btn-sm" data-close-plan>Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="plan-save">Save plan</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        if (!AdminGuard.requireAuth()) throw 0;
        AdminShell.mount('billing.html');

        const isPlatform = AdminGuard.isPlatform();
        let plans = [];
        let partners = [];
        let editingPlanId = null;

        if (isPlatform) {
            document.getElementById('platform-toolbar').style.display = 'flex';
            document.getElementById('page-sub').textContent =
                'Manage landowner plans per partner workspace. Use Workspace limits to enable or cap a partner brand.';
        } else {
            document.getElementById('partner-toolbar').style.display = 'flex';
            document.getElementById('page-sub').textContent =
                'Plans landowners can subscribe to in your app. You manage the catalog; landowners purchase from the mobile app.';
        }

        function money(n) {
            return AdminGuard.money(typeof n === 'number' ? n : Number(n) || 0);
        }
        function cycle() {
            return document.getElementById('cycle')?.value || 'monthly';
        }
        function priceOf(plan) {
            return cycle() === 'yearly' ? Number(plan.yearlyPrice || 0) : Number(plan.monthlyPrice || 0);
        }
        function selectedPartnerId() {
            if (isPlatform) return document.getElementById('partner-select').value || '';
            const u = NeztMateApi.getUser() || {};
            const payload = NeztMateApi.getTokenPayload() || {};
            return u.partnerId || payload.partnerId || '';
        }
        function canManagePlans() {
            return isPlatform || !isPlatform; // both platform + partner admin
        }

        function lim(n, label) {
            if (n === -1 || n === '-1') return 'Unlimited ' + label;
            if (n === 0 || n === '0') return null;
            if (n == null) return null;
            return 'Up to ' + n + ' ' + label;
        }

        function paintPlans() {
            const grid = document.getElementById('plans-grid');
            if (!selectedPartnerId() && isPlatform) {
                grid.innerHTML =
                    '<div class="card empty-state" style="grid-column:1/-1">Select a workspace to view plans.</div>';
                return;
            }
            if (!plans.length) {
                grid.innerHTML =
                    '<div class="card empty-state" style="grid-column:1/-1">No plans yet. Click <strong>New plan</strong> to create one.</div>';
                return;
            }
            grid.innerHTML = plans
                .map((p) => {
                    const price = priceOf(p);
                    const feats = [
                        p.description || null,
                        lim(p.maxUnits != null ? p.maxUnits : p.maxListings, 'units'),
                        lim(p.maxListings, 'listings'),
                        lim(p.maxProperties, 'properties'),
                        lim(p.maxManagers, 'managers'),
                        lim(p.maxArtisans, 'artisans'),
                        p.hasAgentAssignment ? 'Team invites' : null,
                        p.hasAdvancedScreening ? 'Advanced screening' : null,
                        p.hasAnalytics ? 'Analytics' : null,
                        p.hasPrioritySupport ? 'Priority support' : null,
                        p.isActive === false ? 'Inactive' : null,
                    ].filter(Boolean);

                    const actions =
                        '<div style="display:flex;gap:.4rem;margin-top:auto;flex-wrap:wrap">' +
                        '<button type="button" class="btn btn-ghost btn-sm" data-edit="' +
                        AdminGuard.esc(p.id) +
                        '">Edit</button>' +
                        '<button type="button" class="btn btn-ghost btn-sm" data-delete="' +
                        AdminGuard.esc(p.id) +
                        '">Deactivate</button>' +
                        '</div>';

                    return (
                        '<div class="card" style="display:flex;flex-direction:column;gap:.35rem">' +
                        '<div style="display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start">' +
                        '<h3 style="margin:0;text-transform:capitalize">' +
                        AdminGuard.esc(p.name || p.id) +
                        '</h3>' +
                        (p.isActive === false ? AdminGuard.badge('inactive') : AdminGuard.badge('active')) +
                        '</div>' +
                        '<p style="margin:0;font-size:1.25rem;font-weight:800">' +
                        (price === 0 ? 'Free' : money(price)) +
                        (price > 0
                            ? ' <span class="muted" style="font-size:.8rem;font-weight:500">/' +
                            (cycle() === 'yearly' ? 'yr' : 'mo') +
                            '</span>'
                            : '') +
                        '</p>' +
                        '<ul style="margin:0 0 .5rem;padding-left:1.1rem;font-size:.9rem">' +
                        feats.map((f) => '<li>' + AdminGuard.esc(f) + '</li>').join('') +
                        '</ul>' +
                        actions +
                        '</div>'
                    );
                })
                .join('');
        }

        function openPlanModal(plan) {
            editingPlanId = plan ? plan.id : null;
            document.getElementById('plan-modal-title').textContent = plan ? 'Edit plan' : 'New plan';
            document.getElementById('plan-name').value = plan?.name || plan?.id || 'basic';
            document.getElementById('plan-name').disabled = !!plan;
            document.getElementById('plan-description').value = plan?.description || '';
            document.getElementById('plan-monthly').value = plan?.monthlyPrice ?? 0;
            document.getElementById('plan-yearly').value = plan?.yearlyPrice ?? 0;
            document.getElementById('plan-max-units').value = plan?.maxUnits ?? plan?.maxListings ?? 3;
            document.getElementById('plan-max').value = plan?.maxListings ?? 3;
            document.getElementById('plan-max-properties').value = plan?.maxProperties ?? 1;
            document.getElementById('plan-max-managers').value = plan?.maxManagers ?? 0;
            document.getElementById('plan-max-artisans').value = plan?.maxArtisans ?? 0;
            document.getElementById('plan-agent').checked = !!plan?.hasAgentAssignment;
            document.getElementById('plan-screening').checked = !!plan?.hasAdvancedScreening;
            document.getElementById('plan-analytics').checked = !!plan?.hasAnalytics;
            document.getElementById('plan-support').checked = !!plan?.hasPrioritySupport;
            document.getElementById('plan-active').checked = plan?.isActive !== false;
            AdminGuard.openModal('plan-modal');
        }

        async function savePlan() {
            const partnerId = selectedPartnerId();
            if (!partnerId) {
                AdminGuard.showError(isPlatform ? 'Select a workspace first' : 'Workspace missing from your account');
                return;
            }
            const body = {
                name: document.getElementById('plan-name').value,
                description: document.getElementById('plan-description').value.trim(),
                monthlyPrice: Number(document.getElementById('plan-monthly').value) || 0,
                yearlyPrice: Number(document.getElementById('plan-yearly').value) || 0,
                maxUnits: Number(document.getElementById('plan-max-units').value),
                maxListings: Number(document.getElementById('plan-max').value),
                maxProperties: Number(document.getElementById('plan-max-properties').value),
                maxManagers: Number(document.getElementById('plan-max-managers').value),
                maxArtisans: Number(document.getElementById('plan-max-artisans').value),
                hasAgentAssignment: document.getElementById('plan-agent').checked,
                hasAdvancedScreening: document.getElementById('plan-screening').checked,
                hasAnalytics: document.getElementById('plan-analytics').checked,
                hasPrioritySupport: document.getElementById('plan-support').checked,
                isActive: document.getElementById('plan-active').checked,
                partnerId: partnerId,
            };
            try {
                if (editingPlanId) {
                    await NeztMateApi.updateSubscriptionPlan(editingPlanId, body);
                    AdminGuard.showOk('Plan updated');
                } else {
                    await NeztMateApi.createSubscriptionPlan(body);
                    AdminGuard.showOk('Plan created');
                }
                AdminGuard.closeModal('plan-modal');
                await reloadPlans();
            } catch (e) {
                AdminGuard.showError(e.message || 'Failed to save plan');
            }
        }

        async function reloadPlans() {
            const partnerId = selectedPartnerId();
            if (!partnerId) {
                plans = [];
                paintPlans();
                return;
            }
            const data = await AdminGuard.api(
                () => NeztMateApi.getSubscriptionPlans({ partnerId }),
                { plans: [] }
            );
            plans = data.plans || data || [];
            if (!Array.isArray(plans)) plans = [];
            paintPlans();
        }

        function limitsOf(p) {
            const L = (p && p.limits) || {};
            return {
                appEnabled: L.appEnabled !== false && p.isActive !== false,
                subscriptionsEnabled: L.subscriptionsEnabled !== false,
                applicationsEnabled: L.applicationsEnabled !== false,
                maxLandowners: L.maxLandowners != null ? L.maxLandowners : -1,
                maxProperties: L.maxProperties != null ? L.maxProperties : -1,
                maxUnits: L.maxUnits != null ? L.maxUnits : -1,
            };
        }

        async function loadPartnerLimitsForm() {
            const partnerId = selectedPartnerId();
            if (!partnerId) return;
            let p = partners.find((x) => x.id === partnerId);
            if (!p) {
                try {
                    const one = await NeztMateApi.getPartnerById(partnerId);
                    p = one.partner || one;
                } catch (_) {
                    p = {};
                }
            }
            const L = limitsOf(p || {});
            document.getElementById('limits-workspace-label').textContent = p.name || p.slug || partnerId;
            document.getElementById('pl-app-enabled').checked = L.appEnabled;
            document.getElementById('pl-subs-enabled').checked = L.subscriptionsEnabled;
            document.getElementById('pl-apps-enabled').checked = L.applicationsEnabled;
            document.getElementById('pl-max-landowners').value = L.maxLandowners;
            document.getElementById('pl-max-properties').value = L.maxProperties;
            document.getElementById('pl-max-units').value = L.maxUnits;
        }

        async function loadPartnersList() {
            const data = await AdminGuard.api(() => NeztMateApi.listPartners({ activeOnly: 'false' }), {
                partners: [],
            });
            partners = data.partners || data || [];
            if (!Array.isArray(partners)) partners = [];
            const sel = document.getElementById('partner-select');
            sel.innerHTML =
                '<option value="">Select partner…</option>' +
                partners
                    .map(
                        (p) =>
                            '<option value="' +
                            AdminGuard.esc(p.id) +
                            '">' +
                            AdminGuard.esc(p.name || p.slug) +
                            '</option>'
                    )
                    .join('');
            const main =
                partners.find((p) => String(p.slug).toLowerCase() === 'neztmate') || partners[0];
            if (main) {
                sel.value = main.id;
                await reloadPlans();
            }
        }

        document.getElementById('plans-grid').onclick = async (e) => {
            const edit = e.target.closest('[data-edit]');
            const del = e.target.closest('[data-delete]');
            if (edit) {
                const id = edit.getAttribute('data-edit');
                openPlanModal(plans.find((p) => p.id === id));
                return;
            }
            if (del) {
                const id = del.getAttribute('data-delete');
                if (!confirm('Deactivate plan "' + id + '"?')) return;
                try {
                    await NeztMateApi.deleteSubscriptionPlan(id, { partnerId: selectedPartnerId() });
                    AdminGuard.showOk('Plan deactivated');
                } catch (err) {
                    try {
                        await NeztMateApi.updateSubscriptionPlan(id, {
                            isActive: false,
                            partnerId: selectedPartnerId(),
                        });
                        AdminGuard.showOk('Plan deactivated');
                    } catch (e2) {
                        AdminGuard.showError(err.message || e2.message || 'Failed');
                        return;
                    }
                }
                await reloadPlans();
            }
        };

        document.getElementById('btn-new-plan')?.addEventListener('click', () => {
            if (!selectedPartnerId()) {
                AdminGuard.showError('Select a workspace first');
                return;
            }
            openPlanModal(null);
        });
        document.getElementById('btn-new-plan-partner')?.addEventListener('click', () => {
            if (!selectedPartnerId()) {
                AdminGuard.showError('Workspace missing from your session');
                return;
            }
            openPlanModal(null);
        });
        document.getElementById('plan-save')?.addEventListener('click', savePlan);
        document.querySelectorAll('[data-close-plan]').forEach((b) => {
            b.onclick = () => AdminGuard.closeModal('plan-modal');
        });

        document.getElementById('btn-partner-limits')?.addEventListener('click', async () => {
            if (!selectedPartnerId()) {
                AdminGuard.showError('Select a workspace first');
                return;
            }
            const panel = document.getElementById('partner-limits-panel');
            const show = panel.style.display === 'none' || !panel.style.display;
            panel.style.display = show ? 'block' : 'none';
            if (show) await loadPartnerLimitsForm();
        });

        document.getElementById('pl-save')?.addEventListener('click', async () => {
            const partnerId = selectedPartnerId();
            if (!partnerId) return;
            AdminGuard.clearAlerts();
            const appEnabled = document.getElementById('pl-app-enabled').checked;
            const body = {
                isActive: appEnabled,
                limits: {
                    appEnabled: appEnabled,
                    subscriptionsEnabled: document.getElementById('pl-subs-enabled').checked,
                    applicationsEnabled: document.getElementById('pl-apps-enabled').checked,
                    maxLandowners: Number(document.getElementById('pl-max-landowners').value),
                    maxProperties: Number(document.getElementById('pl-max-properties').value),
                    maxUnits: Number(document.getElementById('pl-max-units').value),
                },
            };
            try {
                await NeztMateApi.updatePartner(partnerId, body);
                // also try status endpoint if backend splits isActive
                try {
                    await NeztMateApi.setPartnerStatus(partnerId, { isActive: appEnabled });
                } catch (_) { }
                AdminGuard.showOk('Workspace limits saved');
                const data = await AdminGuard.api(() => NeztMateApi.listPartners({ activeOnly: 'false' }), {
                    partners: [],
                });
                partners = data.partners || data || [];
                await loadPartnerLimitsForm();
            } catch (e) {
                AdminGuard.showError(e.message || 'Failed to save limits');
            }
        });

        document.getElementById('partner-select')?.addEventListener('change', async () => {
            document.getElementById('partner-limits-panel').style.display = 'none';
            await reloadPlans();
        });
        document.getElementById('refresh')?.addEventListener('click', async () => {
            await loadPartnersList();
        });
        document.getElementById('refresh-partner')?.addEventListener('click', reloadPlans);
        document.getElementById('cycle')?.addEventListener('change', paintPlans);

        if (isPlatform) loadPartnersList();
        else reloadPlans();
    </script>
</body>

</html>
