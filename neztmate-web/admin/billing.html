<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billing · NeztMate Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="admin-body">
    <div class="admin-shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="admin-main">
            <header class="admin-top">
                <div><strong>Billing</strong> <span class="muted" id="partner-label"></span></div>
                <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
            </header>
            <div class="admin-content">
                <h1 class="page-title">Billing &amp; plans</h1>
                <p class="page-sub" id="page-sub">Manage subscription plans and billing for this workspace.</p>
                <div id="error" class="alert alert-error" style="display:none"></div>
                <div id="info" class="alert alert-ok" style="display:none"></div>

                <!-- Platform: partner scope -->
                <div class="toolbar" id="platform-toolbar" style="display:none">
                    <label class="muted" style="font-size:.85rem">Workspace</label>
                    <select id="partner-select" class="search" style="max-width:260px">
                        <option value="">Select partner…</option>
                    </select>
                    <button type="button" class="btn btn-primary btn-sm" id="btn-new-plan">New plan</button>
                    <button type="button" class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
                </div>

                <!-- Partner admin: own subscription status -->
                <div class="panel" style="margin-bottom:1.25rem;display:none" id="status-panel"></div>

                <div class="toolbar" id="partner-cycle-bar" style="display:none">
                    <div style="display:flex;gap:.5rem;align-items:center">
                        <span class="muted" style="font-size:.85rem">Billing cycle</span>
                        <select id="cycle" class="search" style="max-width:140px">
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-ghost btn-sm" id="refresh-partner">Refresh</button>
                </div>

                <h2 class="page-title" style="font-size:1.1rem;margin:1rem 0 .75rem" id="plans-heading">Plans</h2>
                <div class="grid-3" id="plans-grid">
                    <div class="card empty-state" style="grid-column:1/-1">Loading…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create / edit plan modal -->
    <div id="plan-modal" class="modal-backdrop hidden">
        <div class="modal" style="max-width:440px">
            <div class="modal-head">
                <h3 id="plan-modal-title">New plan</h3>
                <button type="button" class="btn btn-ghost btn-sm" data-close-plan>×</button>
            </div>
            <div class="modal-body">
                <div class="field"><label>Name (id)</label>
                    <select id="plan-name">
                        <option value="free">free</option>
                        <option value="basic">basic</option>
                        <option value="premium">premium</option>
                        <option value="enterprise">enterprise</option>
                    </select>
                </div>
                <div class="field"><label>Monthly price (₦)</label><input id="plan-monthly" type="number" min="0"
                        step="1" value="0" /></div>
                <div class="field"><label>Yearly price (₦)</label><input id="plan-yearly" type="number" min="0" step="1"
                        value="0" /></div>
                <div class="field"><label>Max listings (-1 = unlimited)</label><input id="plan-max" type="number"
                        value="5" /></div>
                <label class="muted" style="display:flex;gap:.5rem;align-items:center;margin:.4rem 0"><input
                        type="checkbox" id="plan-agent" /> Agent assignment</label>
                <label class="muted" style="display:flex;gap:.5rem;align-items:center;margin:.4rem 0"><input
                        type="checkbox" id="plan-screening" /> Advanced screening</label>
                <label class="muted" style="display:flex;gap:.5rem;align-items:center;margin:.4rem 0"><input
                        type="checkbox" id="plan-analytics" /> Analytics</label>
                <label class="muted" style="display:flex;gap:.5rem;align-items:center;margin:.4rem 0"><input
                        type="checkbox" id="plan-support" /> Priority support</label>
                <label class="muted" style="display:flex;gap:.5rem;align-items:center;margin:.4rem 0"><input
                        type="checkbox" id="plan-active" checked /> Active (shown on pricing)</label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost btn-sm" data-close-plan>Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="plan-save">Save plan</button>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin-shell.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        if (!AdminGuard.requireAuth()) throw 0;
        AdminShell.mount('billing.html');

        const isPlatform = AdminGuard.isPlatform();
        let plans = [];
        let current = null;
        let partners = [];
        let editingPlanId = null;

        document.getElementById('page-sub').textContent = isPlatform
            ? 'Create and manage plans for each partner workspace. Plans appear on the public pricing page for that workspace.'
            : 'View your plan and upgrade. Payment opens with Paystack in a new tab.';

        if (isPlatform) {
            document.getElementById('platform-toolbar').style.display = 'flex';
            document.getElementById('plans-heading').textContent = 'Plans for selected workspace';
        } else {
            document.getElementById('status-panel').style.display = 'block';
            document.getElementById('partner-cycle-bar').style.display = 'flex';
            document.getElementById('plans-heading').textContent = 'Available plans';
        }

        function money(n) {
            return AdminGuard.money(typeof n === 'number' ? n : Number(n) || 0);
        }
        function cycle() {
            return document.getElementById('cycle')?.value || 'monthly';
        }
        function priceOf(plan) {
            return cycle() === 'yearly' ? Number(plan.yearlyPrice || 0) : Number(plan.monthlyPrice || 0);
        }
        function selectedPartnerId() {
            if (isPlatform) return document.getElementById('partner-select').value || '';
            const u = NeztMateApi.getUser() || {};
            const payload = NeztMateApi.getTokenPayload() || {};
            return u.partnerId || payload.partnerId || '';
        }

        function paintStatus() {
            if (isPlatform) return;
            const el = document.getElementById('status-panel');
            if (!current || !current.planId) {
                el.innerHTML =
                    '<h3 style="margin:0 0 .35rem">No active paid plan</h3><p class="muted" style="margin:0">You are on the free tier. Choose a plan below to upgrade.</p>';
                return;
            }
            const st = String(current.status || '').toLowerCase();
            el.innerHTML =
                '<div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-start">' +
                '<div><h3 style="margin:0 0 .35rem">Current: <span style="text-transform:capitalize">' +
                AdminGuard.esc(current.planId) +
                '</span></h3><p style="margin:0">' +
                AdminGuard.badge(current.status) +
                ' <span class="muted">' +
                AdminGuard.esc(current.billingCycle || '') +
                '</span></p><p class="muted" style="margin:.5rem 0 0;font-size:.9rem">' +
                (st === 'cancelled' ? 'Access until' : 'Ends') +
                ': <strong>' +
                (current.endDate ? new Date(current.endDate).toLocaleDateString() : '—') +
                '</strong></p></div>' +
                (st === 'active'
                    ? '<button type="button" class="btn btn-ghost btn-sm" id="btn-cancel">Cancel at period end</button>'
                    : '') +
                '</div>';
            const cancelBtn = document.getElementById('btn-cancel');
            if (cancelBtn) {
                cancelBtn.onclick = async () => {
                    if (!confirm('Cancel subscription? Access continues until the period ends.')) return;
                    try {
                        const res = await NeztMateApi.cancelSubscription();
                        AdminGuard.showOk(res.message || 'Cancellation scheduled');
                        await loadPartner();
                    } catch (e) {
                        AdminGuard.showError(e.message || 'Cancel failed');
                    }
                };
            }
        }

        function paintPlans() {
            const grid = document.getElementById('plans-grid');
            if (!plans.length) {
                grid.innerHTML =
                    '<div class="card empty-state" style="grid-column:1/-1">' +
                    (isPlatform
                        ? 'No plans for this workspace yet. Click <strong>New plan</strong> to create one.'
                        : 'No plans available yet. Contact support if this persists.') +
                    '</div>';
                return;
            }
            grid.innerHTML = plans
                .map((p) => {
                    const price = priceOf(p);
                    const cur =
                        !isPlatform &&
                        current &&
                        String(current.status).toLowerCase() === 'active' &&
                        (String(current.planId).toLowerCase() === String(p.id).toLowerCase() ||
                            String(current.planId).toLowerCase() === String(p.name).toLowerCase());
                    const feats = [
                        p.maxListings === -1 || p.maxListings == null
                            ? 'Unlimited listings'
                            : 'Up to ' + p.maxListings + ' listings',
                        p.hasAgentAssignment ? 'Agent assignment' : null,
                        p.hasAdvancedScreening ? 'Advanced screening' : null,
                        p.hasAnalytics ? 'Analytics' : null,
                        p.hasPrioritySupport ? 'Priority support' : null,
                        p.isActive === false ? 'Inactive' : null,
                    ].filter(Boolean);

                    let actions = '';
                    if (isPlatform) {
                        actions =
                            '<div style="display:flex;gap:.4rem;margin-top:auto">' +
                            '<button type="button" class="btn btn-ghost btn-sm" data-edit="' +
                            AdminGuard.esc(p.id) +
                            '">Edit</button>' +
                            '<button type="button" class="btn btn-ghost btn-sm" data-delete="' +
                            AdminGuard.esc(p.id) +
                            '">Delete</button>' +
                            '</div>';
                    } else {
                        actions =
                            '<button type="button" class="btn ' +
                            (cur ? 'btn-ghost' : 'btn-primary') +
                            ' btn-sm" style="width:100%;margin-top:auto" data-subscribe="' +
                            AdminGuard.esc(p.id || p.name) +
                            '" ' +
                            (cur ? 'disabled' : '') +
                            '>' +
                            (cur ? 'Current plan' : price === 0 ? 'Switch to Free' : 'Subscribe') +
                            '</button>';
                    }

                    return (
                        '<div class="card" style="display:flex;flex-direction:column">' +
                        '<h3 style="margin:0 0 .25rem;text-transform:capitalize">' +
                        AdminGuard.esc(p.name || p.id) +
                        '</h3>' +
                        '<p style="margin:0 0 .75rem;font-size:1.25rem;font-weight:800">' +
                        (price === 0 ? 'Free' : money(price)) +
                        (price > 0
                            ? ' <span class="muted" style="font-size:.8rem;font-weight:500">/' +
                            (cycle() === 'yearly' ? 'yr' : 'mo') +
                            '</span>'
                            : '') +
                        '</p>' +
                        '<ul style="margin:0 0 1rem;padding-left:1.1rem;font-size:.9rem">' +
                        feats.map((f) => '<li>' + AdminGuard.esc(f) + '</li>').join('') +
                        '</ul>' +
                        actions +
                        '</div>'
                    );
                })
                .join('');
        }

        function openPlanModal(plan) {
            editingPlanId = plan ? plan.id : null;
            document.getElementById('plan-modal-title').textContent = plan ? 'Edit plan' : 'New plan';
            document.getElementById('plan-name').value = plan?.name || plan?.id || 'basic';
            document.getElementById('plan-name').disabled = !!plan;
            document.getElementById('plan-monthly').value = plan?.monthlyPrice ?? 0;
            document.getElementById('plan-yearly').value = plan?.yearlyPrice ?? 0;
            document.getElementById('plan-max').value = plan?.maxListings ?? 5;
            document.getElementById('plan-agent').checked = !!plan?.hasAgentAssignment;
            document.getElementById('plan-screening').checked = !!plan?.hasAdvancedScreening;
            document.getElementById('plan-analytics').checked = !!plan?.hasAnalytics;
            document.getElementById('plan-support').checked = !!plan?.hasPrioritySupport;
            document.getElementById('plan-active').checked = plan?.isActive !== false;
            AdminGuard.openModal('plan-modal');
        }

        async function savePlan() {
            const partnerId = selectedPartnerId();
            if (!partnerId) {
                AdminGuard.showError('Select a partner workspace first');
                return;
            }
            const body = {
                name: document.getElementById('plan-name').value,
                monthlyPrice: Number(document.getElementById('plan-monthly').value) || 0,
                yearlyPrice: Number(document.getElementById('plan-yearly').value) || 0,
                maxListings: Number(document.getElementById('plan-max').value),
                hasAgentAssignment: document.getElementById('plan-agent').checked,
                hasAdvancedScreening: document.getElementById('plan-screening').checked,
                hasAnalytics: document.getElementById('plan-analytics').checked,
                hasPrioritySupport: document.getElementById('plan-support').checked,
                isActive: document.getElementById('plan-active').checked,
                partnerId: partnerId,
            };
            try {
                if (editingPlanId) {
                    await NeztMateApi.updateSubscriptionPlan(editingPlanId, body);
                    AdminGuard.showOk('Plan updated');
                } else {
                    await NeztMateApi.createSubscriptionPlan(body);
                    AdminGuard.showOk('Plan created');
                }
                AdminGuard.closeModal('plan-modal');
                await loadPlatform();
            } catch (e) {
                AdminGuard.showError(e.message || 'Save failed');
            }
        }

        async function loadPlatform() {
            AdminGuard.clearAlerts();
            const partnerId = selectedPartnerId();
            if (!partnerId) {
                plans = [];
                paintPlans();
                return;
            }
            const data = await AdminGuard.api(
                () => NeztMateApi.getSubscriptionPlans({ partnerId }),
                { plans: [] }
            );
            plans = data.plans || [];
            if (!Array.isArray(plans)) plans = [];
            plans.sort((a, b) => Number(a.monthlyPrice || 0) - Number(b.monthlyPrice || 0));
            paintPlans();
        }

        async function loadPartner() {
            AdminGuard.clearAlerts();
            const [plansRes, subRes] = await Promise.all([
                AdminGuard.api(() => NeztMateApi.getSubscriptionPlans(), { plans: [] }),
                AdminGuard.api(() => NeztMateApi.getMySubscription(), {}),
            ]);
            plans = plansRes.plans || [];
            if (!Array.isArray(plans)) plans = [];
            plans.sort((a, b) => Number(a.monthlyPrice || 0) - Number(b.monthlyPrice || 0));
            current = subRes.subscription || (subRes.planId ? subRes : null);
            if (subRes.status === 'free') current = null;
            paintStatus();
            paintPlans();
        }

        async function loadPartnersList() {
            const data = await AdminGuard.api(() => NeztMateApi.listPartners(), { partners: [] });
            partners = data.partners || data || [];
            if (!Array.isArray(partners)) partners = [];
            const sel = document.getElementById('partner-select');
            sel.innerHTML =
                '<option value="">Select partner…</option>' +
                partners
                    .map(
                        (p) =>
                            '<option value="' +
                            AdminGuard.esc(p.id) +
                            '">' +
                            AdminGuard.esc(p.name || p.slug || p.id) +
                            '</option>'
                    )
                    .join('');
            // Prefer neztmate / first active
            const main = partners.find((p) => String(p.slug).toLowerCase() === 'neztmate') || partners[0];
            if (main) {
                sel.value = main.id;
                await loadPlatform();
            }
        }

        document.getElementById('plans-grid').onclick = async (e) => {
            const sub = e.target.closest('[data-subscribe]');
            const edit = e.target.closest('[data-edit]');
            const del = e.target.closest('[data-delete]');

            if (sub && !isPlatform) {
                const planId = sub.getAttribute('data-subscribe');
                if (!confirm('Continue with plan "' + planId + '"?')) return;
                try {
                    const res = await NeztMateApi.subscribeToPlan({ planId, billingCycle: cycle() });
                    if (res.requiresPayment && res.authorizationUrl) {
                        AdminGuard.showOk('Complete payment in the Paystack window.');
                        window.open(res.authorizationUrl, '_blank', 'noopener');
                    } else {
                        AdminGuard.showOk(res.message || 'Plan activated');
                        await loadPartner();
                    }
                } catch (err) {
                    AdminGuard.showError(err.message || 'Subscribe failed');
                }
                return;
            }

            if (edit && isPlatform) {
                const id = edit.getAttribute('data-edit');
                const plan = plans.find((p) => p.id === id);
                openPlanModal(plan);
                return;
            }

            if (del && isPlatform) {
                const id = del.getAttribute('data-delete');
                if (!confirm('Deactivate / delete plan "' + id + '"?')) return;
                try {
                    await NeztMateApi.deleteSubscriptionPlan(id, { partnerId: selectedPartnerId() });
                    AdminGuard.showOk('Plan removed');
                    await loadPlatform();
                } catch (err) {
                    // Fallback: soft-deactivate via PATCH if DELETE not implemented
                    try {
                        await NeztMateApi.updateSubscriptionPlan(id, {
                            isActive: false,
                            partnerId: selectedPartnerId(),
                        });
                        AdminGuard.showOk('Plan deactivated');
                        await loadPlatform();
                    } catch (e2) {
                        AdminGuard.showError(err.message || e2.message || 'Delete failed');
                    }
                }
            }
        };

        document.getElementById('btn-new-plan')?.addEventListener('click', () => {
            if (!selectedPartnerId()) {
                AdminGuard.showError('Select a partner first');
                return;
            }
            openPlanModal(null);
        });
        document.getElementById('plan-save')?.addEventListener('click', savePlan);
        document.querySelectorAll('[data-close-plan]').forEach((b) => {
            b.onclick = () => AdminGuard.closeModal('plan-modal');
        });
        document.getElementById('partner-select')?.addEventListener('change', loadPlatform);
        document.getElementById('refresh')?.addEventListener('click', loadPlatform);
        document.getElementById('refresh-partner')?.addEventListener('click', loadPartner);
        document.getElementById('cycle')?.addEventListener('change', paintPlans);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (isPlatform) loadPlatform();
                else loadPartner();
            }
        });

        if (isPlatform) loadPartnersList();
        else loadPartner();
    </script>
</body>

</html>
