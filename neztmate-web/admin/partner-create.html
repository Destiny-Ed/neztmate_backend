<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create partner · Platform Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="logo" href="index.html">Nezt<span>Mate</span></a>
      <nav>
        <a href="partners-list.html">All partners</a>
        <a class="active" href="partner-create.html">Create partner</a>
        <a href="#" id="logout-link">Sign out</a>
      </nav>
      <div class="side-foot" id="side-user">Signed in</div>
    </aside>
    <div class="admin-main">
      <header class="admin-top"><strong>Create partner</strong></header>
      <div class="admin-content">
        <h1 class="page-title">New partner</h1>
        <div id="alert" class="alert" style="display:none"></div>
        <div class="form-card" style="max-width:560px;box-shadow:none">
          <form id="form">
            <div class="field"><label>Name *</label><input id="name" required /></div>
            <div class="field"><label>Slug *</label><input id="slug" required pattern="[a-z0-9-]{3,40}" placeholder="acme-homes" /></div>
            <div class="field"><label>Tagline</label><input id="tagline" /></div>
            <div class="field"><label>Primary color</label><input id="primaryColor" type="color" value="#0d9488" style="height:44px" /></div>
            <div class="field"><label>Support email</label><input id="supportEmail" type="email" /></div>
            <button class="btn btn-primary" type="submit">Create</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    AdminGuard.requireAuth();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      try {
        await NeztMateApi.createPartner({
          name: document.getElementById('name').value.trim(),
          slug: document.getElementById('slug').value.trim().toLowerCase(),
          tagline: document.getElementById('tagline').value.trim(),
          primaryColor: document.getElementById('primaryColor').value,
          supportEmail: document.getElementById('supportEmail').value.trim(),
          status: 'active',
        });
        alertEl.className = 'alert alert-ok';
        alertEl.style.display = 'block';
        alertEl.textContent = 'Partner created';
        setTimeout(() => (location.href = 'partners-list.html'), 800);
      } catch (err) {
        alertEl.className = 'alert alert-error';
        alertEl.style.display = 'block';
        alertEl.textContent = err.message;
      }
    };
  </script>
</body>
</html>
