<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Properties · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Properties</strong> <span class="muted" id="partner-label"></span></div>
        <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
      </header>
      <div class="admin-content">
        <h1 class="page-title">Properties</h1>
        <p class="page-sub">Portfolio for this workspace (partner-scoped).</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div class="toolbar">
          <input class="search" id="q" placeholder="Search properties…" />
          <button class="btn btn-ghost btn-sm" id="refresh">Refresh</button>
        </div>
        <div class="panel"><div class="table-wrap">
          <table class="table">
            <thead><tr><th>Name</th><th>Address</th><th>Units</th><th>Type</th><th>Owner</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="5" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('properties.html');
    let all = [];
    async function load() {
      const data = await AdminGuard.api(() => NeztMateApi.getMyProperties(), { properties: [] });
      all = data.properties || data || [];
      if (!Array.isArray(all)) all = [];
      render();
    }
    function render() {
      const q = document.getElementById('q').value.toLowerCase();
      const list = all.filter((p) => !q || JSON.stringify(p).toLowerCase().includes(q));
      const tb = document.getElementById('tbody');
      if (!list.length) { tb.innerHTML = '<tr><td colspan="5" class="empty-state">No properties</td></tr>'; return; }
      tb.innerHTML = list.map((p) => '<tr><td><strong>'+AdminGuard.esc(p.name)+'</strong></td><td>'+AdminGuard.esc(p.address)+'</td><td>'+(p.totalUnits??'—')+'</td><td>'+AdminGuard.esc(p.type||'—')+'</td><td><code style="font-size:.75rem">'+AdminGuard.esc((p.landownerId||'').slice(0,8))+'</code></td></tr>').join('');
    }
    document.getElementById('q').oninput = render;
    document.getElementById('refresh').onclick = load;
    load();
  </script>
</body>
</html>
