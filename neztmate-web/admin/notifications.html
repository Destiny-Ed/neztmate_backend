<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications · NeztMate Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-top">
        <div><strong>Notifications</strong> <span class="muted" id="partner-label"></span></div>
        <button type="button" class="theme-toggle" id="theme-toggle">🌙</button>
      </header>
      <div class="admin-content">
        <h1 class="page-title">Notifications</h1>
        <p class="page-sub">Recent alerts for this account.</p>
        <div id="error" class="alert alert-error" style="display:none"></div>
        <div class="panel"><div class="table-wrap">
          <table class="table">
            <thead><tr><th>Title</th><th>Body</th><th>Type</th><th>When</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="4" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div></div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-shell.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    if (!AdminGuard.requireAuth()) throw 0;
    AdminShell.mount('notifications.html');
    (async function() {
      var data = await AdminGuard.api(function(){ return NeztMateApi.getNotifications(); }, { notifications: [] });
      var list = data.notifications || data || [];
      var tb = document.getElementById('tbody');
      if (!list.length) { tb.innerHTML = '<tr><td colspan="4" class="empty-state">No notifications</td></tr>'; return; }
      tb.innerHTML = list.map(function(n){
        return '<tr><td><strong>'+AdminGuard.esc(n.title)+'</strong></td><td>'+AdminGuard.esc(n.body)+'</td><td>'+AdminGuard.badge(n.type)+'</td><td>'+(n.createdAt?new Date(n.createdAt).toLocaleString():'—')+'</td></tr>';
      }).join('');
    })();
  </script>
</body>
</html>
